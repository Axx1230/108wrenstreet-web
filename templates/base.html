<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0B0D">
  <meta name="description" content="108 Wren Street — an interactive psychological sci-fi film experience.">
  <title>{% block title %}108 Wren Street — Memory Services{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-page-section="{{ page_section or '' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="108 Wren Street home">108 <span>WREN STREET</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#intake">Intake</a>
      <a href="#memory-vault">Memory vault</a>
      <a href="#oak-tree">Oak tree</a>
      <a href="#epk">Screenings</a>
      <a href="#collaborate">Collaborate</a>
      <a href="#credits">Credits</a>
      <a href="/press-kit">Press kit</a>
    </nav>
    <span class="header-status"><span class="status-dot"></span> SYSTEM ONLINE</span>
  </header>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a class="wordmark" href="/">108 <span>WREN STREET</span></a>
    <span>MEMORY SERVICES // CASE FILE #143</span>
    <a href="#intake">Return to beginning ↑</a>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
