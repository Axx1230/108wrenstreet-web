<!doctype html>
<html lang="en">
<head>
  <!-- Global metadata, fonts, stylesheet, and page-specific Jinja title data. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0B0D">
  <meta name="description" content="{% block description %}108 Wren Street — an interactive psychological sci-fi film experience.{% endblock %}">
  <title>{% block title %}108 Wren Street — Memory Services{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-page-section="{{ page_section or '' }}" data-page-type="{{ 'press' if is_press_page|default(false) else 'story' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="108 Wren Street home">108 <span>WREN STREET</span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span>Menu</span><span class="nav-toggle-icon" aria-hidden="true"></span>
    </button>
    <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
      <div class="nav-story-links">
        <a data-nav-key="intake" href="{{ '/#intake' if is_press_page|default(false) else '#intake' }}">Intake</a>
        <a data-nav-key="memory-vault" href="{{ '/#memory-vault' if is_press_page|default(false) else '#memory-vault' }}">Memory vault</a>
        <a data-nav-key="oak-tree" href="{{ '/#oak-tree' if is_press_page|default(false) else '#oak-tree' }}">Oak tree</a>
        <a data-nav-key="collaborate" href="{{ '/#collaborate' if is_press_page|default(false) else '#collaborate' }}">Collaborate</a>
      </div>
      <div class="nav-press-links">
        <a data-nav-key="screenings" href="/press#screenings">Screenings</a>
        <a data-nav-key="credits" href="/press#credits">Credits</a>
        <a data-nav-key="press-kit" href="/press">Press kit</a>
      </div>
    </nav>
    <span class="header-status"><span class="status-dot"></span> SYSTEM ONLINE</span>
  </header>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a class="wordmark" href="/">108 <span>WREN STREET</span></a>
    <span>MEMORY SERVICES // CASE FILE #143</span>
    <a href="{{ '/#intake' if is_press_page|default(false) else '#intake' }}">Return to beginning ↑</a>
  </footer>
  <script src="{{ url_for('static', filename='js/core.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/api-client.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/scroll-reveal.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
